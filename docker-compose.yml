# Q-Basair production stack (docs/deployment.md): one Contabo VPS, behind
# nginx. The images come from GitHub Container Registry, built and scanned by
# .github/workflows/release.yml and pulled by deploy/server/deploy.sh
# (QBASAIR_IMAGE_TAG = the commit deployed). `docker compose build` still
# builds them locally from this checkout (development, or a registry outage).
services:
  api:
    image: ${QBASAIR_IMAGE_PREFIX:-ghcr.io/ghost0n/basair-quran}-api:${QBASAIR_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    # The deploy user's uid/gid (deploy/server/deploy.sh): files written in
    # data/ stay that user's.
    user: "${QBASAIR_RUN_UID:-1000}:${QBASAIR_RUN_GID:-1000}"
    environment: &api-environment
      PORT: "8001"
      QBASAIR_DB_PATH: /app/data/quran.db
      QBASAIR_AUTH_DB_PATH: /app/data/auth.db
      QBASAIR_TRANSLATIONS_DB_PATH: /app/data/translations.db
      # Shared cache (e.g. verse audio durations), computed once, served to all.
      QBASAIR_CACHE_DB_PATH: /app/data/cache.db
      # The standalone app's downloadable packs (/api/offline), built by the
      # deploy from quran.db + translations.db (scripts/build_offline_packs.py).
      QBASAIR_OFFLINE_PACKS_PATH: /app/data/offline
      QBASAIR_AUTH_ENABLED: ${QBASAIR_AUTH_ENABLED:-0}
      QBASAIR_BUILD_DB_ON_START: ${QBASAIR_BUILD_DB_ON_START:-auto}
      QBASAIR_CORS_ORIGINS: ${QBASAIR_CORS_ORIGINS:-http://localhost}
      QBASAIR_LOW_MEMORY_MODE: ${QBASAIR_LOW_MEMORY_MODE:-0}
      QBASAIR_LLM_PROVIDER: ${QBASAIR_LLM_PROVIDER:-ollama}
      QBASAIR_OLLAMA_BASE_URL: ${QBASAIR_OLLAMA_BASE_URL:-https://ollama.com}
      QBASAIR_LLM_CHAT_MODEL: ${QBASAIR_LLM_CHAT_MODEL:-gemma4:31b-cloud}
      QBASAIR_LLM_EMBED_MODEL: ${QBASAIR_LLM_EMBED_MODEL:-nomic-embed-text}
      QBASAIR_LLM_TIMEOUT_SECONDS: ${QBASAIR_LLM_TIMEOUT_SECONDS:-120}
      QBASAIR_SESSION_COOKIE_NAME: ${QBASAIR_SESSION_COOKIE_NAME:-qbasair_session}
      QBASAIR_SESSION_SECRET: ${QBASAIR_SESSION_SECRET:?set a strong QBASAIR_SESSION_SECRET in .env.production}
      QBASAIR_SESSION_SECURE: ${QBASAIR_SESSION_SECURE:-1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Invite-only signup when set (comma-separated codes); open signup when empty.
      QBASAIR_INVITE_CODES: ${QBASAIR_INVITE_CODES:-}
      # Extra Ollama hosts a client may target (ollama.com is always allowed).
      QBASAIR_OLLAMA_ALLOWED_HOSTS: ${QBASAIR_OLLAMA_ALLOWED_HOSTS:-}
      # Reported by /api/ready so the deploy gate can see what is running.
      QBASAIR_COMMIT_SHA: ${QBASAIR_COMMIT_SHA:-unknown}
      # Password-reset email (optional — without SMTP the token is only logged).
      QBASAIR_PUBLIC_URL: ${QBASAIR_PUBLIC_URL:-}
      QBASAIR_SMTP_HOST: ${QBASAIR_SMTP_HOST:-}
      QBASAIR_SMTP_PORT: ${QBASAIR_SMTP_PORT:-587}
      QBASAIR_SMTP_USER: ${QBASAIR_SMTP_USER:-}
      QBASAIR_SMTP_PASSWORD: ${QBASAIR_SMTP_PASSWORD:-}
      QBASAIR_SMTP_SECURITY: ${QBASAIR_SMTP_SECURITY:-starttls}
      QBASAIR_MAIL_FROM: ${QBASAIR_MAIL_FROM:-}
      # Community moderation (docs/community-moderation-design.md): the batches
      # run in the `worker` service below, not in the API.
      QBASAIR_MODERATION_WORKER: external
      QBASAIR_MODERATION_INTERVAL_SECONDS: ${QBASAIR_MODERATION_INTERVAL_SECONDS:-900}
      QBASAIR_MODERATION_DAILY_BUDGET: ${QBASAIR_MODERATION_DAILY_BUDGET:-2000}
      QBASAIR_MODERATION_MIN_CONFIDENCE: ${QBASAIR_MODERATION_MIN_CONFIDENCE:-0.7}
      QBASAIR_RATE_LIMIT_FEEDBACK_MAX: ${QBASAIR_RATE_LIMIT_FEEDBACK_MAX:-10}
      # Sign-in: "keycloak" with the `keycloak` profile below (docs/keycloak.md
      # → "Production"), or "local" (accounts in auth.db).
      QBASAIR_AUTH_PROVIDER: ${QBASAIR_AUTH_PROVIDER:-local}
      QBASAIR_OIDC_ISSUER: ${QBASAIR_OIDC_ISSUER:-}
      QBASAIR_OIDC_INTERNAL_URL: ${QBASAIR_OIDC_INTERNAL_URL:-}
      QBASAIR_OIDC_CLIENT_SECRET: ${QBASAIR_OIDC_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8001"
    networks:
      - app
    # Bounded container logs so a chatty process can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Resource ceilings (env-tunable per host). Generous for the api since DB /
    # index rebuilds run inside it; drop if the box is small.
    mem_limit: ${QBASAIR_API_MEM_LIMIT:-1g}
    cpus: ${QBASAIR_API_CPUS:-1.5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # The moderation batches: the API's image and settings, its own process
  # (src/app/workers/moderation_worker.py). Restarting it loses nothing — the
  # work waits in the database.
  worker:
    image: ${QBASAIR_IMAGE_PREFIX:-ghcr.io/ghost0n/basair-quran}-api:${QBASAIR_IMAGE_TAG:-latest}
    command: ["python", "-m", "src.app.workers.moderation_worker"]
    user: "${QBASAIR_RUN_UID:-1000}:${QBASAIR_RUN_GID:-1000}"
    environment: *api-environment
    volumes:
      - ./data:/app/data
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${QBASAIR_WORKER_MEM_LIMIT:-384m}
    cpus: ${QBASAIR_WORKER_CPUS:-0.5}
    restart: unless-stopped

  web:
    image: ${QBASAIR_IMAGE_PREFIX:-ghcr.io/ghost0n/basair-quran}-web:${QBASAIR_IMAGE_TAG:-latest}
    # NEXT_PUBLIC_* values are baked in at build time: the release workflow
    # builds with the repository's production variables (docs/deployment.md).
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-0}
        NEXT_PUBLIC_SITE_URL: ${QBASAIR_PUBLIC_URL:-}
        QBASAIR_API_ORIGIN: ${QBASAIR_API_ORIGIN:-http://api:8001}
        QBASAIR_SESSION_COOKIE_NAME: ${QBASAIR_SESSION_COOKIE_NAME:-qbasair_session}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-0}
      QBASAIR_API_ORIGIN: ${QBASAIR_API_ORIGIN:-http://api:8001}
      QBASAIR_SESSION_COOKIE_NAME: ${QBASAIR_SESSION_COOKIE_NAME:-qbasair_session}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${QBASAIR_WEB_MEM_LIMIT:-512m}
    cpus: ${QBASAIR_WEB_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      QBASAIR_ENABLE_TLS: ${QBASAIR_ENABLE_TLS:-0}
      QBASAIR_PUBLIC_DOMAIN: ${QBASAIR_PUBLIC_DOMAIN:-}
      # Behind a CDN only (docs/caching.md): its address ranges (comma-separated
      # CIDRs) and the header carrying the visitor's IP (e.g. CF-Connecting-IP).
      QBASAIR_CDN_TRUSTED_RANGES: ${QBASAIR_CDN_TRUSTED_RANGES:-}
      QBASAIR_CDN_REAL_IP_HEADER: ${QBASAIR_CDN_REAL_IP_HEADER:-}
      # Keycloak's address (auth.<domain>): its own server block, proxied to
      # the `keycloak` service, when set (deploy/nginx/keycloak*.conf.template).
      QBASAIR_AUTH_DOMAIN: ${QBASAIR_AUTH_DOMAIN:-}
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/http.conf.template:/opt/qbasair/http.conf.template:ro
      - ./deploy/nginx/tls.conf.template:/opt/qbasair/tls.conf.template:ro
      - ./deploy/nginx/keycloak-http.conf.template:/opt/qbasair/keycloak-http.conf.template:ro
      - ./deploy/nginx/keycloak-tls.conf.template:/opt/qbasair/keycloak-tls.conf.template:ro
      - ./deploy/nginx/start-nginx.sh:/opt/qbasair/start-nginx.sh:ro
      # Prepared recitations, served as static files (docs/recitation-audio.md).
      - ./data/recitations:/srv/recitations:ro
      # Let's Encrypt: the certificates, and the HTTP-01 challenge files
      # certbot writes (served under /.well-known/acme-challenge/).
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
    command: ["/bin/sh", "/opt/qbasair/start-nginx.sh"]
    networks:
      - edge
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${QBASAIR_NGINX_MEM_LIMIT:-128m}
    cpus: ${QBASAIR_NGINX_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The Let's Encrypt client, run on demand only (the `tls` profile keeps it
  # out of `up`): deploy/server/tls.sh issues the certificate (HTTP-01 through
  # nginx on port 80) and renews it from the daily cron that
  # deploy/server/setup.sh installs, then reloads nginx.
  certbot:
    image: certbot/certbot:v3.1.0
    profiles:
      - tls
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    networks:
      - edge

  # --- Sign-in with Keycloak (docs/keycloak.md → "Production") ---------------
  # Started with COMPOSE_PROFILES=keycloak in .env.production, beside
  # QBASAIR_AUTH_PROVIDER=keycloak. Keycloak owns credentials, email codes,
  # password resets, 2FA and the linked providers; its data is in PostgreSQL
  # (the `keycloak-db` volume, dumped by deploy/server/backup.sh).
  keycloak-db:
    image: postgres:17-alpine
    profiles:
      - keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # deploy/server/deploy.sh refuses to start the profile without it.
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    networks:
      - auth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${QBASAIR_KEYCLOAK_DB_MEM_LIMIT:-256m}
    cpus: ${QBASAIR_KEYCLOAK_DB_CPUS:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: ${QBASAIR_IMAGE_PREFIX:-ghcr.io/ghost0n/basair-quran}-keycloak:${QBASAIR_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    profiles:
      - keycloak
    # Keycloak's image runs as any uid in group 0: the deploy user's, so it
    # reads the realm deploy.sh renders (keycloak/import, mode 600).
    user: "${QBASAIR_RUN_UID:-1000}:0"
    # `start --optimized` (the image's build) and, on the first start only, the
    # realm «qbasair» from keycloak/import (an existing realm is left as it is).
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
      # The public address (tokens' issuer, sign-in pages); TLS ends at nginx.
      KC_HOSTNAME: https://${QBASAIR_AUTH_DOMAIN:-auth.localhost}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # The admin console is not public (nginx refuses /admin): through an SSH
      # tunnel to the port below — ssh -L 8180:127.0.0.1:8180 deploy@<server>.
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:8180}
      # The console's first administrator, created on the first start only.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      # Loopback only: the admin console's tunnel (never reachable from outside).
      - "127.0.0.1:8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app
      - auth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${QBASAIR_KEYCLOAK_MEM_LIMIT:-1g}
    cpus: ${QBASAIR_KEYCLOAK_CPUS:-1.0}
    healthcheck:
      # The management port (health-enabled in Dockerfile.keycloak); the image
      # has no curl. /health/ready answers 200 only once Keycloak is ready (the
      # realm imported): a sub-check's "UP" in a 503 body is not ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Renders the realm «qbasair» from .env.production into keycloak/import/
  # (scripts/keycloak_realm.py, run by deploy/server/deploy.sh before Keycloak
  # starts). A one-off job: its profile keeps it out of `up`.
  keycloak-realm:
    image: ${QBASAIR_IMAGE_PREFIX:-ghcr.io/ghost0n/basair-quran}-api:${QBASAIR_IMAGE_TAG:-latest}
    profiles:
      - keycloak-jobs
    user: "${QBASAIR_RUN_UID:-1000}:${QBASAIR_RUN_GID:-1000}"
    network_mode: none
    command: ["python", "scripts/keycloak_realm.py", "--output", "/realm/qbasair-realm.json"]
    environment:
      QBASAIR_PUBLIC_URL: ${QBASAIR_PUBLIC_URL:-}
      QBASAIR_OIDC_CLIENT_SECRET: ${QBASAIR_OIDC_CLIENT_SECRET:-}
      QBASAIR_APP_REDIRECT_URI: ${QBASAIR_APP_REDIRECT_URI:-}
      KC_THEME: ${KC_THEME:-qbasair}
      KC_SMTP_HOST: ${KC_SMTP_HOST:-}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-587}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-noreply@localhost}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_GOOGLE_CLIENT_ID: ${KC_GOOGLE_CLIENT_ID:-}
      KC_GOOGLE_CLIENT_SECRET: ${KC_GOOGLE_CLIENT_SECRET:-}
      KC_FACEBOOK_CLIENT_ID: ${KC_FACEBOOK_CLIENT_ID:-}
      KC_FACEBOOK_CLIENT_SECRET: ${KC_FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - ./keycloak/import:/realm

networks:
  edge:
  app:
  # Keycloak and its database only.
  auth:

volumes:
  keycloak-db:
