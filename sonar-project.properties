# Sonar analysis (CI "Code quality (Sonar)", docs/deployment.md → "Code quality
# and security scans"). The project key and organisation come from the
# repository variables SONAR_PROJECT_KEY / SONAR_ORGANIZATION; the server from
# SONAR_HOST_URL (SonarQube Cloud when unset); the token from SONAR_TOKEN.

sonar.projectName=Q-Basair
sonar.sourceEncoding=UTF-8

# What is analysed: the API, the web app, the shared packages and the scripts.
sonar.sources=src,scripts,apps/web/app,apps/web/components,apps/web/features,apps/web/lib,packages/shared/src,packages/api-client/src,packages/offline-engine/src
sonar.tests=tests,apps/web,packages/offline-engine
sonar.test.inclusions=tests/**/*.py,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.generated.ts,apps/web/lib/i18n/catalog.json,apps/web/lib/i18n/locales/**,apps/web/public/**,**/*.test.ts,**/*.test.tsx

# Coverage: the backend's, from pytest-cov in the same job.
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
