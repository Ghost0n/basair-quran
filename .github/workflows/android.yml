name: Android

# The standalone Android app (docs/offline-app.md): builds the Quran data and
# the offline core, the app-mode web bundle, then the APK/AAB with Gradle.
#
# Signing (optional — without it the release build is unsigned and only the
# debug APK is installable): repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# The server the app talks to: repository variable QBASAIR_REMOTE_ORIGIN.
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    tags: ["android-v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build_db.py"
      - "scripts/build_mushaf_layout.py"
      - "scripts/build_offline_packs.py"
      - "scripts/fetch_mushaf_fonts.py"
      - "data/quran-narrations/**"
      - "data/quran-morphology.txt"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_REMOTE_ORIGIN: ${{ vars.QBASAIR_REMOTE_ORIGIN }}
      NEXT_PUBLIC_AUTH_ENABLED: "1"
      QBASAIR_VERSION_CODE: ${{ github.run_number }}
      QBASAIR_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Quran data and the offline core (fonts, database, Madani layout, packs)
        env:
          PYTHONPATH: .
          QBASAIR_BUILD_DB_ON_START: never
        run: |
          python scripts/fetch_mushaf_fonts.py
          python scripts/build_db.py
          python scripts/build_mushaf_layout.py
          python scripts/build_offline_packs.py --verify

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Node dependencies
        run: pnpm install --frozen-lockfile

      - name: App bundle (static export + bundled core)
        run: pnpm --filter @q-basair/web build:app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Capacitor sync
        run: pnpm --filter @q-basair/mobile exec cap sync android

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "QBASAIR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "QBASAIR_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "QBASAIR_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "QBASAIR_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No signing secrets: the release APK/AAB are unsigned; install the debug APK."
          fi

      - name: Gradle build
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: basair-android-${{ env.QBASAIR_VERSION_NAME }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Offline packs (for the server's /api/offline)
        uses: actions/upload-artifact@v4
        with:
          name: basair-offline-packs-${{ env.QBASAIR_VERSION_NAME }}
          path: build/offline/
          retention-days: 14
