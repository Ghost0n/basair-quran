name: CLA

# Contributors sign the Contributor License Agreement (CLA.md) once, by
# commenting on their pull request; signatures are kept on the unprotected
# branch `cla-signatures`. pull_request_target runs this workflow from the base
# branch with write access: it never checks out or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Check signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/develop/CLA.md
          branch: cla-signatures
          allowlist: Ghost0n,dependabot[bot],github-actions[bot],claude[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/develop/CLA.md)
            and sign it by commenting below with the sentence that follows. You keep the copyright
            of your work; you only sign once.
