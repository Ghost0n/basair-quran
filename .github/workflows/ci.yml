name: CI

# Phase 0 quality gate: backend tests + frontend build on every PR and on
# pushes to the integration branches. Deployment stays in deploy.yml (main only).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  nginx:
    name: Nginx config (nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the site configs (HTTP, TLS, TLS behind a CDN)
        # Runs the real start-nginx.sh in the production image (with a throwaway
        # certificate and the upstream hosts pointed at localhost), stopping at
        # `nginx -t` instead of starting nginx: the rendered site config and the
        # generated CDN real-IP config are both checked. A broken config would
        # otherwise only show up as a down site on deploy.
        run: |
          check() {
            echo "::group::$1"
            docker run --rm \
              --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
              -e QBASAIR_PUBLIC_DOMAIN=example.test -e QBASAIR_ENABLE_TLS="$2" \
              -e QBASAIR_CDN_TRUSTED_RANGES="$3" -e QBASAIR_CDN_REAL_IP_HEADER="$4" \
              -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/deploy/nginx/http.conf.template:/opt/qbasair/http.conf.template:ro" \
              -v "$PWD/deploy/nginx/tls.conf.template:/opt/qbasair/tls.conf.template:ro" \
              -v "$PWD/deploy/nginx/start-nginx.sh:/opt/qbasair/start-nginx.sh:ro" \
              nginx:1.27-alpine sh -ec '
                apk add --no-cache openssl >/dev/null
                mkdir -p /etc/letsencrypt/live/example.test
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=example.test \
                  -keyout /etc/letsencrypt/live/example.test/privkey.pem \
                  -out /etc/letsencrypt/live/example.test/fullchain.pem 2>/dev/null
                sed "s/^exec nginx .*/nginx -t/" /opt/qbasair/start-nginx.sh | sh
              '
            echo "::endgroup::"
          }
          check "HTTP" 0 "" ""
          check "TLS" 1 "" ""
          check "TLS behind a CDN" 1 "173.245.48.0/20,2400:cb00::/32" "CF-Connecting-IP"
      - name: Check the TLS helper scripts (bash -n, shellcheck)
        run: |
          bash -n scripts/provision_tls.sh scripts/renew_tls.sh
          shellcheck -S warning scripts/provision_tls.sh scripts/renew_tls.sh

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    # Honor the documented tiny-commit escape hatch for the expensive job.
    if: ${{ !contains(github.event.head_commit.message, '[skip-expensive-ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (Vitest)
        run: pnpm --filter @q-basair/web test
      - name: Check interface translations catalog
        run: pnpm --filter @q-basair/web i18n:check
      - name: Build web
        run: pnpm --filter @q-basair/web build
      - name: Build the standalone app bundle (static export)
        env:
          NEXT_PUBLIC_APP_MODE: "1"
        run: pnpm --filter @q-basair/web exec next build

  offline-engine:
    name: Offline engine (server parity)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-expensive-ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile
      - name: Record the server's answers (fixture database)
        env:
          PYTHONPATH: .
        run: python scripts/offline_parity.py --fixture --sample 60
      - name: Typecheck the engine
        run: pnpm --filter @q-basair/offline-engine exec tsc -p .
      - name: Replay them against the engine
        run: pnpm --filter @q-basair/offline-engine test
