name: CI

# Phase 0 quality gate: backend tests + frontend build on every PR and on
# pushes to the integration branches. Deployment stays in deploy.yml (main only).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    # Honor the documented tiny-commit escape hatch for the expensive job.
    if: ${{ !contains(github.event.head_commit.message, '[skip-expensive-ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @q-basair/web build
