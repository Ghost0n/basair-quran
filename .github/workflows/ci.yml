name: CI

# The quality gate on every pull request and on pushes to the integration
# branches: backend tests, the web build, the offline engine's parity with the
# server, the nginx config, a Trivy scan and (when configured) a Sonar
# analysis. Releasing to production is release.yml (main only).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  nginx:
    name: Nginx config (nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the site configs (HTTP, TLS, TLS behind a CDN)
        # Runs the real start-nginx.sh in the production image (with a throwaway
        # certificate and the upstream hosts pointed at localhost), stopping at
        # `nginx -t` instead of starting nginx: the rendered site config and the
        # generated CDN real-IP config are both checked. A broken config would
        # otherwise only show up as a down site on deploy.
        run: |
          check() {
            echo "::group::$1"
            docker run --rm \
              --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
              -e QBASAIR_PUBLIC_DOMAIN=example.test -e QBASAIR_ENABLE_TLS="$2" \
              -e QBASAIR_CDN_TRUSTED_RANGES="$3" -e QBASAIR_CDN_REAL_IP_HEADER="$4" \
              -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/deploy/nginx/http.conf.template:/opt/qbasair/http.conf.template:ro" \
              -v "$PWD/deploy/nginx/tls.conf.template:/opt/qbasair/tls.conf.template:ro" \
              -v "$PWD/deploy/nginx/start-nginx.sh:/opt/qbasair/start-nginx.sh:ro" \
              nginx:1.27-alpine sh -ec '
                apk add --no-cache openssl >/dev/null
                mkdir -p /etc/letsencrypt/live/example.test
                openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=example.test \
                  -keyout /etc/letsencrypt/live/example.test/privkey.pem \
                  -out /etc/letsencrypt/live/example.test/fullchain.pem 2>/dev/null
                sed "s/^exec nginx .*/nginx -t/" /opt/qbasair/start-nginx.sh | sh
              '
            echo "::endgroup::"
          }
          check "HTTP" 0 "" ""
          check "TLS" 1 "" ""
          check "TLS behind a CDN" 1 "173.245.48.0/20,2400:cb00::/32" "CF-Connecting-IP"
      - name: Check the server scripts (bash -n, shellcheck)
        run: |
          for script in deploy/server/*.sh deploy/nginx/start-nginx.sh; do bash -n "$script"; done
          shellcheck -S warning deploy/server/*.sh
      - name: Check the production compose file
        run: |
          cp .env.production.example .env.ci
          sed -i 's/^QBASAIR_SESSION_SECRET=.*/QBASAIR_SESSION_SECRET=ci-only-not-a-secret/' .env.ci
          docker compose --env-file .env.ci config --quiet
          docker compose --env-file .env.ci --profile tls config --quiet

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    # Honor the documented tiny-commit escape hatch for the expensive job.
    if: ${{ !contains(github.event.head_commit.message, '[skip-expensive-ci]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (Vitest)
        run: pnpm --filter @q-basair/web test
      - name: Check interface translations catalog
        run: pnpm --filter @q-basair/web i18n:check
      # The Keycloak login theme reuses the web's tokens, components and strings
      # (docs/keycloak.md): a web change that breaks it fails here. The JAR
      # itself (Maven) is built where Keycloak is deployed.
      - name: Keycloak login theme (tests + build)
        run: |
          pnpm --filter @q-basair/keycloak-theme test
          pnpm --filter @q-basair/keycloak-theme build
      - name: Build web
        run: pnpm --filter @q-basair/web build
      - name: Build the standalone app bundle (static export)
        env:
          NEXT_PUBLIC_APP_MODE: "1"
        # Webpack, as scripts/build-app.mjs builds it (the .app.tsx precedence).
        run: pnpm --filter @q-basair/web exec next build --webpack

  keycloak-email-code:
    name: Keycloak email code (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The required action against Keycloak's own SPI (docs/keycloak.md «Email code»):
      # compiles, runs the code's unit tests and packages the provider JAR.
      - name: Build and test
        working-directory: apps/keycloak-email-code
        run: mvn -B -q package

  offline-engine:
    name: Offline engine (server parity)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-expensive-ci]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile
      - name: Record the server's answers (fixture database)
        env:
          PYTHONPATH: .
        run: python scripts/offline_parity.py --fixture --sample 60
      - name: Typecheck the engine
        run: pnpm --filter @q-basair/offline-engine exec tsc -p .
      - name: Replay them against the engine
        run: pnpm --filter @q-basair/offline-engine test

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dependencies (pnpm-lock.yaml, requirements*.txt), secrets committed by
      # mistake, and misconfigurations in the Dockerfiles. Fails on a CRITICAL
      # or HIGH finding that has a fix; accepted exceptions: .trivyignore.
      - name: Scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules,apps/web/.next,apps/mobile/ios,apps/mobile/android,build,data
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
      # The full report (every severity) for review, kept with the run.
      - name: Full report (all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,apps/web/.next,apps/mobile/ios,apps/mobile/android,build,data
          format: sarif
          output: trivy-report.sarif
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: trivy-report.sarif
          retention-days: 30

  sonar:
    name: Code quality (Sonar)
    runs-on: ubuntu-latest
    # Skipped (green) until SONAR_TOKEN is set: SonarQube Cloud by default, or
    # a self-hosted SonarQube with the SONAR_HOST_URL variable (docs/deployment.md
    # → "Code quality and security scans"). Pull requests from forks get no secrets.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # blame information for new-code detection
      - name: Sonar configured?
        id: enabled
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set: Sonar analysis skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.enabled.outputs.on == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Backend tests with coverage
        if: steps.enabled.outputs.on == 'true'
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -r requirements-dev.txt pytest-cov==6.0.0
          pytest -q --cov=src --cov-report=xml:coverage.xml
      - name: Analyse
        if: steps.enabled.outputs.on == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'ghost0n_q-basair' }}
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'false' }}
