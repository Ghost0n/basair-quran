name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Pull latest code
        run: |
          cd /srv/q-basair
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch authentic mushaf fonts (QPC V1, idempotent)
        run: |
          cd /srv/q-basair
          # Fonts are gitignored binaries served by the web image, which bakes in
          # apps/web/public at build time — so they must be on the host BEFORE the
          # build below. The script is idempotent (skips fonts already present),
          # so this is a no-op fast path on deploys after the first.
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/fetch_mushaf_fonts.py
          else
            docker run --rm -v "$PWD:/repo" -w /repo python:3.12-slim python scripts/fetch_mushaf_fonts.py
          fi

      # Build BEFORE any rebuild step so the rebuild scripts run against the
      # freshly-built image (new code), not a stale one. This also regenerates
      # data/quran.db via QBASAIR_BUILD_DB_ON_START=auto if a prior deploy's
      # `[rebuild-db]` untrack transition removed it from the working tree.
      - name: Build and start stack
        run: |
          cd /srv/q-basair
          # Expose the deployed commit to /api/ready.
          export QBASAIR_COMMIT_SHA="$(git rev-parse --short HEAD)"
          docker compose --env-file .env.production up -d --build --remove-orphans

      - name: Tag images with the deployed commit (for fast rollback)
        run: |
          cd /srv/q-basair
          SHA="$(git rev-parse --short HEAD)"
          # Best-effort: tag the freshly built api/web images with the commit so a
          # rollback can retag a prior image without rebuilding. See
          # docs/rollback-runbook.md. Never fail the deploy on a tagging hiccup.
          for svc in api web; do
            img="$(docker compose --env-file .env.production images -q "$svc" 2>/dev/null || true)"
            if [ -n "$img" ]; then
              docker tag "$img" "qbasair-${svc}:${SHA}" || true
              docker tag "$img" "qbasair-${svc}:previous-$(cat /srv/q-basair/.last_deploy_sha 2>/dev/null || echo none)" || true
            fi
          done
          echo "$SHA" > /srv/q-basair/.last_deploy_sha || true

      - name: Rebuild quran.db if requested
        run: |
          cd /srv/q-basair
          if git log -1 --pretty=%B | grep -q '\[rebuild-db\]'; then
            echo "rebuild-db tag detected — rebuilding quran.db (fresh image)..."
            docker compose --env-file .env.production run --rm api python scripts/build_db.py
            # build_db.py recreates quran.db, dropping the additive layout tables,
            # so the authentic Madani (QCF) layout must be rebuilt right after it.
            echo "rebuilding authentic Madani layout tables..."
            docker compose --env-file .env.production run --rm api python scripts/build_mushaf_layout.py
            # The running api holds quran.db open read-only — restart it so it
            # reopens the freshly generated database.
            docker compose --env-file .env.production up -d --no-deps api
            # The shared API cache (docs/caching.md) holds up to an hour of
            # Quran responses from the old database: drop it.
            docker compose --env-file .env.production exec -T nginx sh -c 'rm -rf /var/cache/nginx/qbasair/*' || true
          else
            echo "No rebuild-db tag — skipping quran.db rebuild."
          fi

      - name: Rebuild research index if requested
        run: |
          cd /srv/q-basair
          if git log -1 --pretty=%B | grep -q '\[rebuild-index\]'; then
            echo "rebuild-index tag detected — rebuilding research index (fresh image)..."
            docker compose --env-file .env.production run --rm api python scripts/build_research_index.py
            docker compose --env-file .env.production up -d --no-deps api
          else
            echo "No rebuild-index tag — skipping research index rebuild."
          fi

      - name: Build Quran translations and the app's offline packs if requested (or missing)
        run: |
          cd /srv/q-basair
          msg=$(git log -1 --pretty=%B)
          # The web reads data/translations.db directly. The Android/iOS app
          # downloads each translation (and narration) on demand as a pack from
          # /api/offline (QBASAIR_OFFLINE_PACKS_PATH=/app/data/offline); packs are
          # cut from quran.db + translations.db, so they follow either rebuild.
          # Runs on the checkout itself: the api image has no apps/ (interface packs).
          packs="python scripts/build_offline_packs.py --output data/offline"
          run_on_checkout() {
            docker compose --env-file .env.production run -d --rm \
              -v "$PWD:/repo" -w /repo -e PYTHONPATH=/repo api sh -c "$1"
          }
          if echo "$msg" | grep -q '\[rebuild-translations\]' || [ ! -f data/translations.db ]; then
            echo "building data/translations.db from QuranEnc / Tanzil, then the offline packs, in the background..."
            # ~60 languages x 114 surah requests: longer than a deploy should wait.
            # Detached; downloads are cached in data/translation_cache/ (resumable),
            # and the api picks the new files up by itself once they are swapped in.
            run_on_checkout "python scripts/build_translations.py && $packs"
          elif echo "$msg" | grep -q '\[rebuild-db\]' || [ ! -f data/offline/manifest.json ]; then
            echo "building the offline packs in the background..."
            run_on_checkout "$packs"
          else
            echo "No rebuild tag — keeping data/translations.db and data/offline/."
          fi

      - name: Pre-fill the shared recitation cache if requested (or missing)
        run: |
          cd /srv/q-basair
          # Every verse duration of every reciter (docs/caching.md), so no reader
          # ever sees an estimated surah length. ~50k small range requests to the
          # audio host: detached, resumable (already-measured verses are skipped).
          if git log -1 --pretty=%B | grep -q '\[prefill-recitation\]' || [ ! -f data/cache.db ]; then
            echo "pre-filling data/cache.db (recitation durations) in the background..."
            docker compose --env-file .env.production run -d --rm api python scripts/prefill_recitation_cache.py
          else
            echo "No prefill-recitation tag — keeping data/cache.db."
          fi

      - name: Prepare the recitations if requested
        run: |
          cd /srv/q-basair
          # One MP3 + verse timings per reciter and surah (docs/recitation-audio.md),
          # served by nginx. Gigabytes from the audio sources: only on the tag,
          # detached and resumable (prepared surahs are kept). Which reciters:
          # QBASAIR_PREPARE_RECITERS in .env.production — "configured" (default,
          # those in scripts/recitation_sources.json), "all", or a list of ids.
          if git log -1 --pretty=%B | grep -q '\[prepare-recitations\]'; then
            reciters=$(grep -E '^QBASAIR_PREPARE_RECITERS=' .env.production | tail -1 | cut -d= -f2-)
            mkdir -p data/recitations
            echo "preparing the recitations (${reciters:-configured}) in the background..."
            docker compose --env-file .env.production run -d --rm api python scripts/build_recitations.py --reciters "${reciters:-configured}"
          else
            echo "No prepare-recitations tag — keeping data/recitations."
          fi

      # DB-aware readiness gate with a retry loop (the API may be mid-rebuild or
      # still opening the DB right after a restart). /api/ready runs SELECT 1.
      - name: Verify readiness
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf https://basair-al-quran.duckdns.org/api/ready | grep -q '"db":true'; then
              echo "Stack is ready."
              exit 0
            fi
            echo "Not ready yet (attempt ${attempt}/20)…"
            sleep 6
          done
          echo "Readiness check failed after retries."
          # Say why: a TLS failure (expired / self-signed certificate) looks the
          # same as a down API to `curl -sf`.
          curl -sS -o /dev/null https://basair-al-quran.duckdns.org/api/ready || true
          echo "Certificate served on 443:"
          echo | openssl s_client -connect basair-al-quran.duckdns.org:443 \
            -servername basair-al-quran.duckdns.org 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate || true
          curl -s -o /dev/null -w "Plain HTTP /healthz on the host: %{http_code}\n" \
            -H 'Host: basair-al-quran.duckdns.org' http://127.0.0.1/healthz || true
          exit 1
