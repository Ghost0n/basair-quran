# Weekly dependency updates, grouped, against develop (CONTRIBUTING.md).
#
# Runtime versions move together, on purpose, in one change: the Python and
# Node images (Dockerfile.api, apps/web/Dockerfile), the versions CI tests on
# (.github/workflows/*.yml) and @types/node. Dependabot therefore proposes no
# major or minor runtime jump (CI would test the old runtime and pass), only
# patches of the image in use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (the native compiler) drops the JavaScript API that
      # Next.js 15 uses to load next.config.ts and type-check the build, and
      # that scripts/i18n.mjs uses to read the sources. The code is ready for
      # it (no baseUrl, typed byte arrays, declared CSS imports): move to 7
      # together with a Next.js version that supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    # One pull request for all the actions, so save/restore pairs and the
    # pinned commits move together.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /apps/web]
    target-branch: develop
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
