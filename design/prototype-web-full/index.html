<div class="app" id="app" lang="ar">
  <nav class="rail" id="rail" aria-label="التنقل"></nav>
  <main class="main" id="main">
    <div class="topbar">
      <div class="crumbs"><h1 id="crumb-title"></h1><span id="crumb-sub"></span></div>
      <div class="top-actions">
        <form class="cmd" id="cmd" role="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label for="cmd-input" class="sr">ابحث بجذر أو آية أو سؤال</label>
          <input id="cmd-input" placeholder="جذر، أو ٤٥:٢٠، أو اطرح سؤالاً" autocomplete="off" enterkeyhint="search">
          <kbd>Ctrl K</kbd>
        </form>
      </div>
    </div>
  </main>
  <div class="dock" id="dock" aria-label="التلاوة"></div>
</div>
