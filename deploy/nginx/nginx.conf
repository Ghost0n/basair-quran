worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Compress text responses (API JSON, HTML, CSS/JS). Glyph fonts are WOFF2
    # (already compressed) and are deliberately not listed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Long request lines (e.g. share URLs carrying an Arabic query) need more
    # than the 8k default header buffer.
    large_client_header_buffers 4 16k;

    # Shared API response cache (docs/caching.md). Only responses the API marks
    # cacheable (Cache-Control public/max-age — the Quran text, pages, layouts,
    # morphology, catalogs, search, translations, verse durations) are stored:
    # no proxy_cache_valid is set, so anything without an explicit lifetime —
    # every per-user route — passes straight through, and nginx never stores a
    # response that sets a cookie. One copy serves every user.
    proxy_cache_path /var/cache/nginx/qbasair levels=1:2 keys_zone=qbasair_api:16m
                     max_size=1g inactive=7d use_temp_path=off;

    # Offline packs are already static files on the API's disk (tens of MB):
    # caching them again would only evict the small, hot API responses.
    map $uri $qbasair_no_edge_cache {
        default          0;
        ~^/api/offline/  1;
    }

    include /etc/nginx/conf.d/*.conf;

}
