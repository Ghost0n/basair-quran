worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;

    # Drop-in vhost configs from co-located stacks on this host.
    # Any app can place a server block file in /srv/nginx-vhosts.d/ and
    # signal `docker exec qbasair-nginx nginx -s reload` to activate it.
    # The directory is created by start-nginx.sh if absent.
    include /srv/nginx-vhosts.d/*.conf;
}
